# 心晴谷 危机关键词配置
# 注意：援助文案需产品负责人审核后方可上线使用
version: "1.0"
note: "援助文案需产品负责人审核后方可上线使用"

keywords:
  - pattern: "想死|不想活|自杀|自残|自伤"
    severity: "high"
  - pattern: "割腕|跳楼|吃药自杀|上吊|烧炭"
    severity: "high"
  - pattern: "活着没意思|生不如死|没有希望|了结|结束生命"
    severity: "medium"
  - pattern: "想消失|不想存在|世界没有我会更好"
    severity: "medium"

aid_message:
  title: "我们很在意你的安全"
  body: |
    你刚才说的话让我很担心你的安全。
    如果你正处于即时危险，请立即联系当地紧急服务或身边可信任的人。
    以下号码来自产品草案，尚待产品负责人核验，演示环境不可将其视为已验证信息：

    [待核验] 全国心理援助热线：400-161-9995
    [待核验] 北京心理危机研究与干预中心：010-82951332
    [待核验] 生命热线：400-821-1215
  footer: "（此援助信息需经产品负责人审核确认）"
  options:
    continue_text: "我可以继续活动"
    pause_text: "我需要休息一下"
