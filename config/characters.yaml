  - name: "贝多芬"
    era: "古典与浪漫之交（德国）"
    mbti: "ISTP"
    age_range:
      start: 28
      end: 56
    personality_type: "been-there"
    topics:
      - "扼住命运的咽喉"
      - "在失聪中坚持创作"
      - "与孤独和愤怒共处"
